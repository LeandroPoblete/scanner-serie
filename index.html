<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Escanear número de serie</title>

  <!-- LIBRERÍA -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .contenedor {
      max-width: 520px;
      margin: auto;
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .instruccion {
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .dato {
      background: #f4f6f8;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    #reader {
      width: 100%;
      min-height: 260px;
      overflow: hidden;
      background: #000000;
      border-radius: 12px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: contain !important;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #botonIniciar {
      background: #111111;
      color: #ffffff;
    }

    #botonCancelar {
      background: #eeeeee;
      color: #111111;
    }

    #botonReintentar {
      display: none;
      background: #111111;
      color: #ffffff;
    }

    #estado {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: bold;
      line-height: 1.4;
    }

    .ok {
      display: block !important;
      background: #e9f7ef;
      color: #176b38;
    }

    .error {
      display: block !important;
      background: #fdecea;
      color: #a12622;
    }

    .info {
      display: block !important;
      background: #eef3f8;
      color: #263746;
    }

    .ayuda {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      color: #555555;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>
    Escanear número de serie
  </h1>

  <p class="instruccion">
    Apunta la cámara al código de barras del dispensador.
  </p>

  <div class="dato">
    Mantén visible el código completo y deja un pequeño margen
    a ambos lados de las barras.
  </div>

  <div id="reader"></div>

  <button
    id="botonIniciar"
    type="button"
    onclick="iniciarScanner()"
  >
    📷 Abrir cámara
  </button>

  <button
    id="botonReintentar"
    type="button"
    onclick="reiniciarScanner()"
  >
    🔄 Intentar nuevamente
  </button>

  <button
    id="botonCancelar"
    type="button"
    onclick="volverSinSerie()"
  >
    Cancelar
  </button>

  <div id="estado"></div>

  <div class="ayuda">
    Si cuesta leer el código, aléjate un poco del dispensador
    hasta que todas las barras se vean nítidas en pantalla.
  </div>

</div>


<script>

  // =====================================================
  // CONFIGURACIÓN
  // =====================================================

  const URL_APP =
    'https://script.google.com/macros/s/AKfycbwe56twC3hQQ2du1BgEXpqBIzo1_qXJb5rvkh6kScr3RNQ0zkm86ATszEwzRIqG_a_HOw/exec';


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const ID_ACTIVO =
    String(
      parametros.get('id') || ''
    )
      .trim()
      .toUpperCase();


  let scanner =
    null;

  let lecturaRealizada =
    false;

  let scannerIniciado =
    false;


  // =====================================================
  // MENSAJES
  // =====================================================

  function mostrarEstado(
    texto,
    tipo
  ) {

    const estado =
      document.getElementById(
        'estado'
      );

    estado.textContent =
      texto;

    estado.className =
      tipo || 'info';

    estado.style.display =
      'block';

  }


  // =====================================================
  // OBTENER CÁMARA
  // =====================================================

  async function obtenerCamaraPreferida() {

    const camaras =
      await Html5Qrcode.getCameras();


    if (
      !camaras ||
      camaras.length === 0
    ) {

      throw new Error(
        'No se encontraron cámaras disponibles.'
      );

    }


    console.log(
      'Cámaras encontradas:',
      camaras
    );


    // Buscar alguna cámara trasera
    let camaraTrasera =
      camaras.find(
        camara => {

          const nombre =
            String(
              camara.label || ''
            )
              .toLowerCase();

          return (
            nombre.includes('back') ||
            nombre.includes('rear') ||
            nombre.includes('environment') ||
            nombre.includes('trasera') ||
            nombre.includes('posterior')
          );

        }
      );


    // En iPhone muchas veces la cámara trasera
    // aparece al final de la lista
    if (!camaraTrasera) {

      camaraTrasera =
        camaras[
          camaras.length - 1
        ];

    }


    return camaraTrasera;

  }


  // =====================================================
  // INICIAR ESCÁNER
  // =====================================================

  async function iniciarScanner() {

    if (scannerIniciado) {
      return;
    }


    if (!ID_ACTIVO) {

      mostrarEstado(
        'No se recibió el identificador del dispensador.',
        'error'
      );

      return;

    }


    const boton =
      document.getElementById(
        'botonIniciar'
      );

    const botonReintentar =
      document.getElementById(
        'botonReintentar'
      );


    boton.disabled =
      true;

    boton.textContent =
      'Abriendo cámara...';

    botonReintentar.style.display =
      'none';


    try {

      mostrarEstado(
        'Solicitando acceso a la cámara...',
        'info'
      );


      // =================================================
      // CÁMARA DISPONIBLE
      // =================================================

      const camara =
        await obtenerCamaraPreferida();


      console.log(
        'Cámara seleccionada:',
        camara
      );


      // =================================================
      // CREAR LECTOR
      // =================================================

      scanner =
        new Html5Qrcode(

          'reader',

          {

            formatsToSupport: [

              Html5QrcodeSupportedFormats.CODE_128,

              Html5QrcodeSupportedFormats.CODE_39,

              Html5QrcodeSupportedFormats.CODE_93,

              Html5QrcodeSupportedFormats.CODABAR,

              Html5QrcodeSupportedFormats.ITF,

              Html5QrcodeSupportedFormats.EAN_13,

              Html5QrcodeSupportedFormats.EAN_8,

              Html5QrcodeSupportedFormats.UPC_A,

              Html5QrcodeSupportedFormats.UPC_E

            ],

            useBarCodeDetectorIfSupported:
              true

          }

        );


      scannerIniciado =
        true;


      mostrarEstado(
        'Buscando código de barras...',
        'info'
      );


      // =================================================
      // INICIAR CÁMARA
      // IMPORTANTE:
      // SIN QRBOX PARA LEER TODA LA IMAGEN
      // =================================================

      await scanner.start(

        camara.id,

        {

          fps: 12,

          aspectRatio:
            1.777778

        },


        // ===============================================
        // LECTURA EXITOSA
        // ===============================================

        async function(
          textoDetectado
        ) {

          if (lecturaRealizada) {
            return;
          }


          let serie =
            String(
              textoDetectado || ''
            )
              .trim();


          console.log(
            'Código original:',
            serie
          );


          // Nos quedamos solo con números
          serie =
            serie.replace(
              /\D/g,
              ''
            );


          // Protección contra lecturas basura
          if (
            !serie ||
            serie.length < 6
          ) {

            return;

          }


          lecturaRealizada =
            true;


          mostrarEstado(
            '✓ Serie detectada: ' +
            serie,
            'ok'
          );


          if (
            navigator.vibrate
          ) {

            navigator.vibrate(
              150
            );

          }


          // =============================================
          // APAGAR CÁMARA
          // =============================================

          try {

            if (scanner) {

              await scanner.stop();

            }

          } catch (error) {

            console.log(
              'Error al detener cámara:',
              error
            );

          }


          scannerIniciado =
            false;


          // =============================================
          // VOLVER A APPS SCRIPT CON LA SERIE
          // =============================================

          setTimeout(

            function() {


              const destino =

                URL_APP +

                '?id=' +

                encodeURIComponent(
                  ID_ACTIVO
                ) +

                '&serie=' +

                encodeURIComponent(
                  serie
                );


              window.location.href =
                destino;


            },

            700

          );

        },


        // ===============================================
        // ERROR DE DECODIFICACIÓN
        // Se ignora porque el lector sigue buscando
        // ===============================================

        function(
          errorLectura
        ) {

          // Intencionalmente vacío

        }

      );


      boton.style.display =
        'none';


    } catch (error) {


      console.error(
        'ERROR CÁMARA:',
        error
      );


      scannerIniciado =
        false;


      boton.disabled =
        false;

      boton.style.display =
        'block';

      boton.textContent =
        '📷 Abrir cámara';


      botonReintentar.style.display =
        'block';


      const detalle =
        error &&
        error.message
          ? error.message
          : String(error);


      mostrarEstado(
        'Error de cámara: ' +
        detalle,
        'error'
      );

    }

  }


  // =====================================================
  // REINTENTAR
  // =====================================================

  async function reiniciarScanner() {

    lecturaRealizada =
      false;


    if (scanner) {

      try {

        await scanner.stop();

      } catch (error) {

        console.log(
          error
        );

      }


      try {

        await scanner.clear();

      } catch (error) {

        console.log(
          error
        );

      }

    }


    scanner =
      null;

    scannerIniciado =
      false;


    document.getElementById(
      'reader'
    ).innerHTML =
      '';


    document.getElementById(
      'botonReintentar'
    ).style.display =
      'none';


    iniciarScanner();

  }


  // =====================================================
  // CANCELAR
  // =====================================================

  async function volverSinSerie() {


    if (scanner) {

      try {

        await scanner.stop();

      } catch (error) {

        console.log(
          error
        );

      }

    }


    if (ID_ACTIVO) {


      window.location.href =

        URL_APP +

        '?id=' +

        encodeURIComponent(
          ID_ACTIVO
        );


    } else {


      window.history.back();


    }

  }


  // =====================================================
  // APAGAR CÁMARA AL SALIR
  // =====================================================

  window.addEventListener(

    'pagehide',

    function() {


      if (
        scanner &&
        scannerIniciado
      ) {


        scanner.stop()
          .catch(
            function() {}
          );


      }

    }

  );

</script>


</body>

</html>
