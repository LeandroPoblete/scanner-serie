<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Escanear número de serie</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .contenedor {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .instruccion {
      line-height: 1.5;
      margin-bottom: 18px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #botonIniciar {
      background: #111111;
      color: white;
    }

    #botonCancelar {
      background: #eeeeee;
      color: #111111;
    }

    #estado {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: bold;
    }

    .ok {
      background: #e9f7ef;
    }

    .error {
      background: #fdecea;
    }

    .dato {
      background: #f4f6f8;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>
    Escanear número de serie
  </h1>

  <p class="instruccion">
    Apunta la cámara al código de barras ubicado en la etiqueta
    del dispensador.
  </p>

  <div class="dato">
    El sistema completará automáticamente el número de serie
    cuando detecte el código.
  </div>

  <div id="reader"></div>

  <button
    id="botonIniciar"
    type="button"
    onclick="iniciarScanner()"
  >
    📷 Abrir cámara
  </button>

  <button
    id="botonCancelar"
    type="button"
    onclick="volverSinSerie()"
  >
    Cancelar
  </button>

  <div id="estado"></div>

</div>


<script>

  // ==========================================
  // CONFIGURACIÓN
  // ==========================================

  const URL_APP =
    'https://script.google.com/macros/s/AKfycbwe56twC3hQQ2du1BgEXpqBIzo1_qXJb5rvkh6kScr3RNQ0zkm86ATszEwzRIqG_a_HOw/exec';


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const ID_ACTIVO =
    String(
      parametros.get('id') || ''
    )
      .trim()
      .toUpperCase();


  let scanner =
    null;

  let lecturaRealizada =
    false;


  // ==========================================
  // MOSTRAR MENSAJE
  // ==========================================

  function mostrarEstado(
    texto,
    tipo
  ) {

    const estado =
      document.getElementById(
        'estado'
      );

    estado.style.display =
      'block';

    estado.className =
      tipo || '';

    estado.textContent =
      texto;

  }


  // ==========================================
  // INICIAR CÁMARA
  // ==========================================
async function iniciarScanner() {

  if (!ID_ACTIVO) {

    mostrarEstado(
      'No se recibió el identificador del dispensador.',
      'error'
    );

    return;

  }

  const boton =
    document.getElementById(
      'botonIniciar'
    );

  boton.disabled = true;

  boton.textContent =
    'Buscando cámara...';


  try {

    // ========================================
    // OBTENER CÁMARAS DISPONIBLES
    // ========================================

    const camaras =
      await Html5Qrcode.getCameras();


    if (
      !camaras ||
      camaras.length === 0
    ) {

      throw new Error(
        'No se encontraron cámaras disponibles.'
      );

    }


    console.log(
      'Cámaras encontradas:',
      camaras
    );


    // ========================================
    // BUSCAR CÁMARA TRASERA
    // ========================================

    let camaraSeleccionada =
      camaras.find(
        camara => {

          const nombre =
            String(
              camara.label || ''
            ).toLowerCase();

          return (
            nombre.includes('back') ||
            nombre.includes('rear') ||
            nombre.includes('environment') ||
            nombre.includes('trasera') ||
            nombre.includes('posterior')
          );

        }
      );


    // Si Safari no entrega nombres claros,
    // usamos la última cámara de la lista.
    // En iPhone normalmente corresponde
    // a una cámara posterior.

    if (!camaraSeleccionada) {

      camaraSeleccionada =
        camaras[
          camaras.length - 1
        ];

    }


    mostrarEstado(
      'Abriendo cámara...',
      ''
    );


    // ========================================
    // CREAR ESCÁNER
    // ========================================

    scanner =
      new Html5Qrcode(
        'reader',
        {
          formatsToSupport: [

            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8

          ]
        }
      );


    // ========================================
    // INICIAR CON CAMERA ID REAL
    // ========================================

    await scanner.start(

      camaraSeleccionada.id,

      {

{
  fps: 15,

  qrbox: function(
    viewfinderWidth,
    viewfinderHeight
  ) {

    const width =
      Math.floor(
        viewfinderWidth * 0.92
      );

    const height =
      Math.min(
        150,
        Math.floor(
          viewfinderHeight * 0.35
        )
      );

    return {
      width: width,
      height: height
    };

  }
}
        }

      },


      // ======================================
      // CÓDIGO DETECTADO
      // ======================================

      async function(
        textoDetectado
      ) {

        if (lecturaRealizada) {
          return;
        }


        let serie =
          String(
            textoDetectado || ''
          )
            .trim()
            .replace(
              /\D/g,
              ''
            );


        if (
          !serie ||
          serie.length < 6
        ) {

          return;

        }


        lecturaRealizada = true;


        mostrarEstado(
          '✓ Serie detectada: ' +
          serie,
          'ok'
        );


        if (
          navigator.vibrate
        ) {

          navigator.vibrate(
            150
          );

        }


        try {

          await scanner.stop();

        } catch (error) {

          console.log(
            error
          );

        }


        // ====================================
        // VOLVER A APPS SCRIPT
        // ====================================

        setTimeout(
          function() {

            window.location.href =

              URL_APP +

              '?id=' +
              encodeURIComponent(
                ID_ACTIVO
              ) +

              '&serie=' +
              encodeURIComponent(
                serie
              );

          },

          600
        );

      },


      // Mientras busca, ignoramos errores
      function(error) {

      }

    );


    boton.style.display =
      'none';


    mostrarEstado(
      'Buscando código de barras...',
      ''
    );


  } catch (error) {

    console.error(
      error
    );


    boton.disabled =
      false;

    boton.textContent =
      '📷 Abrir cámara';


    // IMPORTANTE:
    // ahora veremos el error verdadero del iPhone

    mostrarEstado(

      'Error cámara: ' +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      ),

      'error'

    );

  }

}
  // ==========================================
  // CANCELAR Y VOLVER
  // ==========================================

  async function volverSinSerie() {

    if (scanner) {

      try {

        await scanner.stop();

      } catch (error) {

        console.log(
          error
        );

      }

    }


    if (ID_ACTIVO) {

      window.location.href =

        URL_APP +

        '?id=' +
        encodeURIComponent(
          ID_ACTIVO
        );

    } else {

      window.history.back();

    }

  }

</script>


</body>

</html>
