<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Escanear número de serie</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitulo {
      margin-top: 0;
      line-height: 1.45;
      color: #444444;
    }

    #reader {
      width: 100%;
      max-width: 460px;
      height: 275px;
      margin: 18px auto 0 auto;
      overflow: hidden;
      background: #000000;
      border-radius: 14px;
    }

    #reader video {
      width: 100% !important;
      height: 275px !important;
      object-fit: cover !important;
    }

    .ayuda {
      margin-top: 12px;
      padding: 11px;
      background: #f4f6f8;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
      color: #555555;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #botonIniciar {
      background: #111111;
      color: #ffffff;
    }

    #botonReintentar {
      display: none;
      background: #eeeeee;
      color: #111111;
    }

    #botonCancelar {
      background: #eeeeee;
      color: #111111;
    }

    #estado {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
    }

    .info {
      display: block !important;
      background: #eef3f8;
      color: #263746;
    }

    .error {
      display: block !important;
      background: #fdecea;
      color: #a12622;
    }

    .ok {
      display: block !important;
      background: #e9f7ef;
      color: #176b38;
    }

    /* =========================================
       CONFIRMACIÓN
       ========================================= */

    #confirmacion {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #e9f7ef;
      border-radius: 12px;
    }

    .titulo-confirmacion {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #serieDetectada {
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
    }

    #formatoDetectado {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: #555555;
    }

    #botonConfirmar {
      background: #111111;
      color: #ffffff;
    }

    #botonVolverEscanear {
      background: #ffffff;
      color: #111111;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>
    Escanear número de serie
  </h1>

  <p class="subtitulo">
    Apunta la cámara al código de barras de la etiqueta del dispensador.
  </p>


  <!-- ======================================
       CÁMARA
       ====================================== -->

  <div id="reader"></div>


  <div class="ayuda">
    Mantén el código completo dentro del visor.
    Deja un pequeño margen a ambos lados de las barras.
  </div>


  <button
    id="botonIniciar"
    type="button"
    onclick="iniciarScanner()"
  >
    📷 Abrir cámara
  </button>


  <button
    id="botonReintentar"
    type="button"
    onclick="reiniciarScanner()"
  >
    🔄 Intentar nuevamente
  </button>


  <!-- ======================================
       RESULTADO / CONFIRMACIÓN
       ====================================== -->

  <div id="confirmacion">

    <div class="titulo-confirmacion">
      Código detectado
    </div>

    <div id="serieDetectada">
    </div>

    <div id="formatoDetectado">
    </div>

    <button
      id="botonConfirmar"
      type="button"
      onclick="confirmarSerie()"
    >
      ✓ Confirmar código
    </button>

    <button
      id="botonVolverEscanear"
      type="button"
      onclick="volverAEscanear()"
    >
      🔄 Escanear nuevamente
    </button>

  </div>


  <button
    id="botonCancelar"
    type="button"
    onclick="volverSinSerie()"
  >
    Cancelar
  </button>


  <div id="estado"></div>

</div>


<script>

  // =====================================================
  // CONFIGURACIÓN GENERAL
  // =====================================================

  const URL_APP =
    'https://script.google.com/macros/s/AKfycbwe56twC3hQQ2du1BgEXpqBIzo1_qXJb5rvkh6kScr3RNQ0zkm86ATszEwzRIqG_a_HOw/exec';


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const ID_ACTIVO =
    String(
      parametros.get('id') || ''
    )
      .trim()
      .toUpperCase();


  let scanner =
    null;

  let scannerActivo =
    false;

  let lecturaRealizada =
    false;

  let seriePendiente =
    '';

  let formatoPendiente =
    '';


  // =====================================================
  // MENSAJES
  // =====================================================

  function mostrarEstado(
    texto,
    tipo
  ) {

    const estado =
      document.getElementById(
        'estado'
      );

    estado.textContent =
      texto;

    estado.className =
      tipo || 'info';

    estado.style.display =
      'block';

  }


  // =====================================================
  // CREAR LECTOR
  // =====================================================

  function crearScanner() {

    return new Html5Qrcode(

      'reader',

      {

        formatsToSupport: [

          // Principales formatos alfanuméricos
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,

          // Mantener compatibilidad adicional 1D
          Html5QrcodeSupportedFormats.CODABAR

        ],

        useBarCodeDetectorIfSupported:
          true

      }

    );

  }


  // =====================================================
  // ZONA DE LECTURA
  // Franja horizontal
  // =====================================================

  const configuracionLectura = {

    fps: 12,

    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const ancho =
          Math.floor(
            viewfinderWidth * 0.90
          );

        const alto =
          Math.min(
            115,
            Math.floor(
              viewfinderHeight * 0.42
            )
          );

        return {

          width:
            ancho,

          height:
            alto

        };

      }

  };


  // =====================================================
  // CÓDIGO DETECTADO
  // =====================================================

  async function codigoDetectado(
    textoDetectado,
    resultadoCompleto
  ) {

    if (lecturaRealizada) {
      return;
    }


    let serie =
      String(
        textoDetectado || ''
      )
        .trim()
        .toUpperCase();


    // ==========================================
    // IMPORTANTE
    // Conservamos letras, números, guiones,
    // paréntesis y demás símbolos del código.
    // Solo eliminamos espacios.
    // ==========================================

    serie =
      serie.replace(
        /\s+/g,
        ''
      );


    if (
      !serie ||
      serie.length < 4
    ) {

      return;

    }


    lecturaRealizada =
      true;


    seriePendiente =
      serie;


    // ==========================================
    // FORMATO DETECTADO
    // ==========================================

    try {

      formatoPendiente =
        String(
          resultadoCompleto
            ?.result
            ?.format
            ?.formatName || ''
        );

    } catch (error) {

      formatoPendiente =
        '';

    }


    console.log(
      'Código detectado:',
      seriePendiente
    );


    // ==========================================
    // DETENER CÁMARA
    // ==========================================

    try {

      if (
        scanner &&
        scannerActivo
      ) {

        await scanner.stop();

      }

    } catch (error) {

      console.log(
        error
      );

    }


    scannerActivo =
      false;


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        150
      );

    }


    // ==========================================
    // MOSTRAR CONFIRMACIÓN
    // ==========================================

    document
      .getElementById(
        'serieDetectada'
      )
      .textContent =
        seriePendiente;


    const textoFormato =
      document.getElementById(
        'formatoDetectado'
      );


    if (formatoPendiente) {

      textoFormato.textContent =
        'Formato detectado: ' +
        formatoPendiente;

    } else {

      textoFormato.textContent =
        '';

    }


    document
      .getElementById(
        'confirmacion'
      )
      .style
      .display =
        'block';


    document
      .getElementById(
        'reader'
      )
      .style
      .display =
        'none';


    document
      .getElementById(
        'botonIniciar'
      )
      .style
      .display =
        'none';


    document
      .getElementById(
        'botonReintentar'
      )
      .style
      .display =
        'none';


    mostrarEstado(
      'Revisa que el código coincida con la etiqueta antes de confirmar.',
      'ok'
    );

  }


  // =====================================================
  // INICIAR ESCÁNER
  // =====================================================

  async function iniciarScanner() {


    if (!ID_ACTIVO) {

      mostrarEstado(
        'No se recibió el identificador del dispensador.',
        'error'
      );

      return;

    }


    if (scannerActivo) {
      return;
    }


    lecturaRealizada =
      false;

    seriePendiente =
      '';

    formatoPendiente =
      '';


    document
      .getElementById(
        'confirmacion'
      )
      .style
      .display =
        'none';


    document
      .getElementById(
        'reader'
      )
      .style
      .display =
        'block';


    const boton =
      document.getElementById(
        'botonIniciar'
      );


    boton.disabled =
      true;

    boton.textContent =
      'Abriendo cámara...';


    try {


      scanner =
        crearScanner();


      mostrarEstado(
        'Abriendo cámara trasera...',
        'info'
      );


      // ==========================================
      // PRIMER INTENTO:
      // cámara trasera
      // ==========================================

      try {


        await scanner.start(

          {
            facingMode:
              'environment'
          },

          configuracionLectura,

          codigoDetectado,

          function(
            errorLectura
          ) {

            // Sigue intentando leer

          }

        );


        scannerActivo =
          true;


      } catch (
        primerError
      ) {


        console.log(
          'Primer intento:',
          primerError
        );


        // ======================================
        // SEGUNDO INTENTO:
        // seleccionar cámara por ID
        // ======================================

        try {


          if (scanner) {

            try {

              await scanner.clear();

            } catch (error) {}

          }


          scanner =
            crearScanner();


          const camaras =
            await Html5Qrcode
              .getCameras();


          if (
            !camaras ||
            camaras.length === 0
          ) {

            throw new Error(
              'No se encontraron cámaras disponibles.'
            );

          }


          let camaraElegida =
            camaras.find(
              function(
                camara
              ) {

                const nombre =
                  String(
                    camara.label || ''
                  )
                    .toLowerCase();


                return (

                  nombre.includes(
                    'back'
                  ) ||

                  nombre.includes(
                    'rear'
                  ) ||

                  nombre.includes(
                    'environment'
                  ) ||

                  nombre.includes(
                    'trasera'
                  ) ||

                  nombre.includes(
                    'posterior'
                  )

                );

              }
            );


          if (!camaraElegida) {

            camaraElegida =
              camaras[
                camaras.length - 1
              ];

          }


          await scanner.start(

            camaraElegida.id,

            configuracionLectura,

            codigoDetectado,

            function(
              errorLectura
            ) {

              // Sigue intentando

            }

          );


          scannerActivo =
            true;


        } catch (
          segundoError
        ) {


          throw segundoError;

        }

      }


      boton.style.display =
        'none';


      mostrarEstado(
        'Buscando código de barras...',
        'info'
      );


    } catch (error) {


      console.error(
        error
      );


      scannerActivo =
        false;


      boton.disabled =
        false;

      boton.style.display =
        'block';

      boton.textContent =
        '📷 Abrir cámara';


      document
        .getElementById(
          'botonReintentar'
        )
        .style
        .display =
          'block';


      const detalle =

        error &&
        error.message

          ? error.message

          : String(
              error
            );


      mostrarEstado(
        'No fue posible abrir la cámara: ' +
        detalle,
        'error'
      );

    }

  }


  // =====================================================
  // CONFIRMAR SERIE
  // =====================================================

  function confirmarSerie() {


    if (!seriePendiente) {

      mostrarEstado(
        'No existe un código para confirmar.',
        'error'
      );

      return;

    }


    const destino =

      URL_APP +

      '?id=' +

      encodeURIComponent(
        ID_ACTIVO
      ) +

      '&serie=' +

      encodeURIComponent(
        seriePendiente
      );


    window.location.href =
      destino;

  }


  // =====================================================
  // VOLVER A ESCANEAR
  // =====================================================

  async function volverAEscanear() {


    lecturaRealizada =
      false;

    seriePendiente =
      '';

    formatoPendiente =
      '';


    document
      .getElementById(
        'confirmacion'
      )
      .style
      .display =
        'none';


    document
      .getElementById(
        'reader'
      )
      .style
      .display =
        'block';


    document
      .getElementById(
        'estado'
      )
      .style
      .display =
        'none';


    await limpiarScanner();


    iniciarScanner();

  }


  // =====================================================
  // LIMPIAR SCANNER
  // =====================================================

  async function limpiarScanner() {


    if (scanner) {


      try {

        if (scannerActivo) {

          await scanner.stop();

        }

      } catch (error) {}


      try {

        await scanner.clear();

      } catch (error) {}


    }


    scanner =
      null;

    scannerActivo =
      false;


    document
      .getElementById(
        'reader'
      )
      .innerHTML =
        '';

  }


  // =====================================================
  // REINTENTAR
  // =====================================================

  async function reiniciarScanner() {


    await limpiarScanner();


    lecturaRealizada =
      false;


    document
      .getElementById(
        'botonIniciar'
      )
      .style
      .display =
        'block';


    document
      .getElementById(
        'botonReintentar'
      )
      .style
      .display =
        'none';


    iniciarScanner();

  }


  // =====================================================
  // CANCELAR
  // =====================================================

  async function volverSinSerie() {


    await limpiarScanner();


    if (ID_ACTIVO) {


      window.location.href =

        URL_APP +

        '?id=' +

        encodeURIComponent(
          ID_ACTIVO
        );


    } else {


      window.history.back();


    }

  }


  // =====================================================
  // APAGAR CÁMARA AL SALIR
  // =====================================================

  window.addEventListener(

    'pagehide',

    function() {


      if (
        scanner &&
        scannerActivo
      ) {


        scanner.stop()
          .catch(
            function() {}
          );


      }

    }

  );

</script>


</body>

</html>
