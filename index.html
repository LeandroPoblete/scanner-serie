<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Escanear número de serie</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .contenedor {
      max-width: 500px;
      margin: auto;
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitulo {
      margin-top: 0;
      line-height: 1.45;
      color: #444444;
    }

    .ayuda {
      margin-top: 14px;
      padding: 12px;
      background: #f4f6f8;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.45;
    }

    /* =========================================
       CONTENEDOR DE CÁMARA MÁS PEQUEÑO
       ========================================= */

    #reader {
      width: 100%;
      max-width: 460px;
      height: 285px;
      margin: 18px auto 0 auto;
      overflow: hidden;
      background: #000000;
      border-radius: 14px;
    }

    #reader video {
      width: 100% !important;
      height: 285px !important;
      object-fit: cover !important;
    }

    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #botonIniciar {
      background: #111111;
      color: #ffffff;
    }

    #botonReintentar {
      display: none;
      background: #111111;
      color: #ffffff;
    }

    #botonCancelar {
      background: #eeeeee;
      color: #111111;
    }

    #estado {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
    }

    .info {
      display: block !important;
      background: #eef3f8;
      color: #263746;
    }

    .ok {
      display: block !important;
      background: #e9f7ef;
      color: #176b38;
    }

    .error {
      display: block !important;
      background: #fdecea;
      color: #a12622;
    }

    .serie-detectada {
      margin-top: 10px;
      font-size: 18px;
      word-break: break-all;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>
    Escanear número de serie
  </h1>

  <p class="subtitulo">
    Apunta la cámara al código de barras de la etiqueta
    del dispensador.
  </p>

  <div id="reader"></div>

  <div class="ayuda">
    Mantén todo el código dentro de la franja de lectura.
    Funciona con códigos numéricos y alfanuméricos.
  </div>

  <button
    id="botonIniciar"
    type="button"
    onclick="iniciarScanner()"
  >
    📷 Abrir cámara
  </button>

  <button
    id="botonReintentar"
    type="button"
    onclick="reiniciarScanner()"
  >
    🔄 Intentar nuevamente
  </button>

  <button
    id="botonCancelar"
    type="button"
    onclick="volverSinSerie()"
  >
    Cancelar
  </button>

  <div id="estado"></div>

</div>


<script>

  // =====================================================
  // CONFIGURACIÓN GENERAL
  // =====================================================

  const URL_APP =
    'https://script.google.com/macros/s/AKfycbwe56twC3hQQ2du1BgEXpqBIzo1_qXJb5rvkh6kScr3RNQ0zkm86ATszEwzRIqG_a_HOw/exec';


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const ID_ACTIVO =
    String(
      parametros.get('id') || ''
    )
      .trim()
      .toUpperCase();


  let scanner =
    null;

  let scannerActivo =
    false;

  let lecturaRealizada =
    false;


  // =====================================================
  // MENSAJES
  // =====================================================

  function mostrarEstado(
    texto,
    tipo
  ) {

    const estado =
      document.getElementById(
        'estado'
      );

    estado.style.display =
      'block';

    estado.className =
      tipo || 'info';

    estado.innerHTML =
      texto;

  }


  // =====================================================
  // CREAR LECTOR
  // =====================================================

  function crearScanner() {

    return new Html5Qrcode(

      'reader',

      {

        formatsToSupport: [

          // ALFANUMÉRICOS
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,

          // OTROS 1D
          Html5QrcodeSupportedFormats.CODABAR,
          Html5QrcodeSupportedFormats.ITF,

          // NUMÉRICOS
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E

        ],

        useBarCodeDetectorIfSupported:
          true

      }

    );

  }


  // =====================================================
  // CONFIGURACIÓN DE ZONA DE LECTURA
  // Franja ancha y baja
  // =====================================================

  const configuracionLectura = {

    fps: 12,

    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const ancho =
          Math.floor(
            viewfinderWidth * 0.88
          );

        const alto =
          Math.min(
            105,
            Math.floor(
              viewfinderHeight * 0.38
            )
          );

        return {

          width:
            ancho,

          height:
            alto

        };

      },

    aspectRatio:
      1.777778

  };


  // =====================================================
  // PROCESAR LECTURA
  // =====================================================

  async function codigoDetectado(
    textoDetectado,
    resultadoCompleto
  ) {

    if (lecturaRealizada) {
      return;
    }


    // IMPORTANTE:
    // NO eliminamos letras.

    let serie =
      String(
        textoDetectado || ''
      )
        .trim()
        .toUpperCase();


    // Quitamos solo espacios.
    // Conservamos:
    // letras
    // números
    // guiones
    // otros caracteres válidos del código

    serie =
      serie.replace(
        /\s+/g,
        ''
      );


    if (
      !serie ||
      serie.length < 4
    ) {

      return;

    }


    lecturaRealizada =
      true;


    console.log(
      'Serie detectada:',
      serie
    );


    mostrarEstado(

      '✓ Código detectado' +

      '<div class="serie-detectada">' +

      serie +

      '</div>',

      'ok'

    );


    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        150
      );

    }


    // ===============================================
    // DETENER CÁMARA
    // ===============================================

    try {

      if (
        scanner &&
        scannerActivo
      ) {

        await scanner.stop();

      }

    } catch (error) {

      console.log(
        error
      );

    }


    scannerActivo =
      false;


    // ===============================================
    // VOLVER A APPS SCRIPT
    // ===============================================

    setTimeout(

      function() {

        const destino =

          URL_APP +

          '?id=' +

          encodeURIComponent(
            ID_ACTIVO
          ) +

          '&serie=' +

          encodeURIComponent(
            serie
          );


        window.location.href =
          destino;

      },

      900

    );

  }


  // =====================================================
  // INICIAR ESCÁNER
  // =====================================================

  async function iniciarScanner() {


    if (!ID_ACTIVO) {

      mostrarEstado(
        'No se recibió el identificador del dispensador.',
        'error'
      );

      return;

    }


    if (scannerActivo) {
      return;
    }


    const boton =
      document.getElementById(
        'botonIniciar'
      );


    const botonReintentar =
      document.getElementById(
        'botonReintentar'
      );


    boton.disabled =
      true;

    boton.textContent =
      'Abriendo cámara...';

    botonReintentar.style.display =
      'none';


    lecturaRealizada =
      false;


    try {

      scanner =
        crearScanner();


      mostrarEstado(
        'Abriendo cámara trasera...',
        'info'
      );


      // ===============================================
      // PRIMER INTENTO
      // Cámara trasera directamente
      // ===============================================

      try {

        await scanner.start(

          {
            facingMode:
              'environment'
          },

          configuracionLectura,

          codigoDetectado,

          function(
            errorLectura
          ) {

            // Normal mientras busca un código

          }

        );


        scannerActivo =
          true;


      } catch (
        primerError
      ) {


        console.log(
          'Primer intento falló:',
          primerError
        );


        // =============================================
        // SEGUNDO INTENTO
        // Obtener cámaras y usar ID real
        // =============================================

        try {

          if (scanner) {

            try {

              await scanner.clear();

            } catch (error) {}

          }


          scanner =
            crearScanner();


          const camaras =
            await Html5Qrcode
              .getCameras();


          if (
            !camaras ||
            camaras.length === 0
          ) {

            throw new Error(
              'No se encontraron cámaras disponibles.'
            );

          }


          let camaraElegida =
            null;


          // Buscar cámara trasera por nombre

          camaraElegida =
            camaras.find(
              function(camara) {

                const nombre =
                  String(
                    camara.label || ''
                  )
                    .toLowerCase();


                return (

                  nombre.includes(
                    'back'
                  ) ||

                  nombre.includes(
                    'rear'
                  ) ||

                  nombre.includes(
                    'environment'
                  ) ||

                  nombre.includes(
                    'trasera'
                  ) ||

                  nombre.includes(
                    'posterior'
                  )

                );

              }
            );


          // Si Safari no da nombres útiles,
          // usar última cámara disponible

          if (!camaraElegida) {

            camaraElegida =
              camaras[
                camaras.length - 1
              ];

          }


          await scanner.start(

            camaraElegida.id,

            configuracionLectura,

            codigoDetectado,

            function(
              errorLectura
            ) {

              // Sigue intentando

            }

          );


          scannerActivo =
            true;

        } catch (
          segundoError
        ) {


          console.error(
            segundoError
          );


          throw segundoError;

        }

      }


      boton.style.display =
        'none';


      mostrarEstado(
        'Buscando código de barras...',
        'info'
      );


    } catch (error) {


      console.error(
        'Error cámara:',
        error
      );


      scannerActivo =
        false;


      boton.disabled =
        false;

      boton.style.display =
        'block';

      boton.textContent =
        '📷 Abrir cámara';


      botonReintentar.style.display =
        'block';


      const detalle =

        error &&
        error.message

          ? error.message

          : String(
              error
            );


      mostrarEstado(

        'No fue posible abrir la cámara.<br><br>' +

        '<small>' +

        detalle +

        '</small>',

        'error'

      );

    }

  }


  // =====================================================
  // REINTENTAR
  // =====================================================

  async function reiniciarScanner() {


    lecturaRealizada =
      false;


    if (scanner) {

      try {

        if (scannerActivo) {

          await scanner.stop();

        }

      } catch (error) {}


      try {

        await scanner.clear();

      } catch (error) {}

    }


    scanner =
      null;

    scannerActivo =
      false;


    document
      .getElementById(
        'reader'
      )
      .innerHTML =
        '';


    document
      .getElementById(
        'botonIniciar'
      )
      .style
      .display =
        'block';


    document
      .getElementById(
        'botonReintentar'
      )
      .style
      .display =
        'none';


    iniciarScanner();

  }


  // =====================================================
  // CANCELAR
  // =====================================================

  async function volverSinSerie() {


    if (scanner) {

      try {

        if (scannerActivo) {

          await scanner.stop();

        }

      } catch (error) {}

    }


    if (ID_ACTIVO) {


      window.location.href =

        URL_APP +

        '?id=' +

        encodeURIComponent(
          ID_ACTIVO
        );


    } else {


      window.history.back();


    }

  }


  // =====================================================
  // APAGAR CÁMARA AL SALIR
  // =====================================================

  window.addEventListener(

    'pagehide',

    function() {


      if (
        scanner &&
        scannerActivo
      ) {


        scanner.stop()
          .catch(
            function() {}
          );


      }

    }

  );

</script>


</body>

</html>
